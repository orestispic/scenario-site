name = "scenario-commercial-api-preproduction"
main = "worker/src/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
SCENARIO_ENVIRONMENT = "staging"
API_ALLOWED_ORIGINS = "https://preproduction.example.invalid,tauri://localhost,http://tauri.localhost"
RATE_LIMIT_MAX_REQUESTS = "60"
RATE_LIMIT_WINDOW_SECONDS = "60"
STRIPE_WEBHOOK_TOLERANCE_SECONDS = "300"
AI_PROVIDER_TIMEOUT_MS = "90000"
AI_SHORT_MAX_BODY_BYTES = "131072"
AI_PDF_MAX_BODY_BYTES = "1048576"
AI_MAX_TRANSLATION_SEGMENTS = "2000"
AI_MAX_RESPONSE_BYTES = "2097152"
CLOUD_STORAGE_BUCKET = "scenario-documents-preproduction"
CLOUD_MAX_BODY_BYTES = "4194304"
CLOUD_DOWNLOAD_TTL_SECONDS = "300"
STUDIO_INVITATION_TTL_SECONDS = "86400"
STUDIO_EVENT_PAGE_SIZE = "100"
STUDIO_TICKET_TTL_SECONDS = "30"
STUDIO_HEARTBEAT_SECONDS = "10"
STUDIO_IDLE_TIMEOUT_SECONDS = "30"
STUDIO_MAX_CONNECTION_SECONDS = "3600"
STUDIO_MAX_CONNECTIONS = "32"
STUDIO_MAX_PROFILE_CONNECTIONS = "3"
STUDIO_MAX_OPERATION_BYTES = "65536"
STUDIO_MAX_PENDING_EVENTS = "500"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitBucket"

[[migrations]]
tag = "phase4-rate-limit-v1"
new_sqlite_classes = ["RateLimitBucket"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false

# Supply separate Supabase TEST, Stripe TEST and signing secrets through the
# secret manager, including CLOUD_IDEMPOTENCY_PEPPER and
# STUDIO_INVITATION_PEPPER and STUDIO_TICKET_PEPPER. The notification
# provider and STUDIO_REALTIME_CHANNEL binding remain deliberately
# unconfigured until isolated test infrastructure exists. No production
# route, account_id or resource is configured.
